<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supervisor</title>
  <style>
    :root { color-scheme: light dark; --background: #fff; --surface: #f5f5f5; --text: #202020; --muted: #646464; --border: #d5d5d5; --active: #137747; --error: #a72727; --danger: #a72727; }
    :root[data-theme="dark"] { --background: #181818; --surface: #242424; --text: #efefef; --muted: #b0b0b0; --border: #505050; --active: #50b884; --error: #ff9797; --danger: #ff9797; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--color-background-primary, var(--background)); color: var(--color-text-primary, var(--text)); font: 15px/1.5 var(--font-sans, -apple-system, BlinkMacSystemFont, sans-serif); }
    main { padding: 24px; max-width: 720px; margin: auto; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 24px; }
    h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
    section { border-top: 1px solid var(--color-border-primary, var(--border)); padding: 20px 0; }
    p { margin: 4px 0 12px; }
    .muted { color: var(--color-text-secondary, var(--muted)); font-size: 14px; }
    .path { overflow-wrap: anywhere; }
    label { display: block; margin-bottom: 6px; }
    input, select, button { font: inherit; color: inherit; min-height: 44px; border: 1px solid var(--color-border-primary, var(--border)); border-radius: 6px; background: var(--color-background-primary, var(--background)); }
    input, select { padding: 8px 10px; min-width: 0; width: 100%; }
    button { padding: 8px 14px; cursor: pointer; }
    button:hover:enabled { background: var(--color-background-secondary, var(--surface)); }
    button:disabled { cursor: default; opacity: .55; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--active); outline-offset: 3px; }
    .form-row { display: flex; gap: 8px; align-items: center; }
    .form-row button { flex-shrink: 0; }
    .existing { margin-bottom: 16px; }
    .field-group { margin-top: 16px; }
    .field-group:first-child { margin-top: 0; }
    .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .settings-grid .field-group { margin-top: 0; }
    .settings-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
    .settings-actions p { margin: 0; min-width: 0; }
    .model-note { margin-top: 8px; }
    .catalog-state { margin: 8px 0 0; }
    .stale-note { color: var(--error); }
    .danger { color: var(--danger); }
    .danger:hover:enabled { background: color-mix(in srgb, var(--danger) 10%, transparent); }
    .switch-row { display: flex; gap: 16px; align-items: center; justify-content: space-between; }
    .switch-row p { margin-bottom: 0; }
    .switch { display: flex; align-items: center; gap: 8px; min-width: 104px; flex-shrink: 0; }
    .switch-track { display: inline-flex; width: 32px; height: 18px; padding: 3px; align-items: center; background: var(--muted); border-radius: 9px; }
    .switch-knob { width: 12px; height: 12px; background: #fff; border-radius: 50%; }
    .switch[aria-checked="true"] .switch-track { background: var(--active); justify-content: flex-end; }
    .switch[data-stale="true"] .switch-track { background: var(--muted); }
    #notice { min-height: 22px; margin: 12px 0 0; font-size: 14px; color: var(--color-text-secondary, var(--muted)); }
    #notice.error { color: var(--error); }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .section-heading h2 { margin: 0; }
    ul { list-style: none; padding: 0; margin: 12px 0 0; }
    li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--color-border-primary, var(--border)); }
    .job-copy { min-width: 0; }
    .job-id, .job-meta { display: block; overflow-wrap: anywhere; }
    .job-meta { margin-top: 2px; }
    .job-status { flex-shrink: 0; color: var(--color-text-secondary, var(--muted)); text-align: right; }
    [hidden] { display: none !important; }
    @media (max-width: 420px) { main { padding: 16px; } .form-row { flex-wrap: wrap; } .form-row input, .form-row select { flex-basis: 100%; } .switch-row { gap: 8px; } .settings-grid { grid-template-columns: 1fr; } .settings-actions { align-items: flex-start; flex-direction: column; } .settings-actions button { width: 100%; } li { gap: 8px; } }
  </style>
</head>
<body>
  <main id="panel" aria-busy="false">
    <h1>Supervisor</h1>
    <section aria-labelledby="workspace-heading">
      <h2 id="workspace-heading">工程</h2>
      <div class="existing" id="existing-workspaces" hidden>
        <label for="workspaces">已关联工程</label>
        <div class="form-row"><select id="workspaces"><option value="">选择已关联的工程</option></select><button id="choose" type="button" disabled>选择</button></div>
      </div>
      <div id="workspace-form">
        <label for="workspace-input">工程目录</label>
        <div class="form-row"><input id="workspace-input" name="workspace" type="text" autocomplete="off" spellcheck="false" placeholder="/完整路径/工程目录" maxlength="4096"><button id="bind" type="button" disabled>关联工程</button></div>
      </div>
      <p class="path" id="workspace-name">尚未选择工程</p>
      <p class="path muted" id="workspace-path">选择要管理的工程后，再使用开关。</p>
    </section>
    <section aria-labelledby="switch-heading">
      <div class="switch-row">
        <div><h2 id="switch-heading">Supervisor 执行</h2><p class="muted">允许当前工程派发已授权任务</p></div>
        <button id="enabled" type="button" class="switch" role="switch" aria-label="Supervisor 执行开关" aria-describedby="notice" aria-checked="false" disabled><span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span><span id="enabled-label">未连接</span></button>
      </div>
      <p class="muted">关闭后暂停新执行，已运行任务继续完成。</p>
      <p id="notice" role="status" aria-live="polite">正在连接 Supervisor…</p>
    </section>
    <section aria-labelledby="model-heading">
      <div class="section-heading"><h2 id="model-heading">执行模型</h2><button id="load-models" type="button" disabled>读取模型目录</button></div>
      <p class="muted model-note" id="model-limitation" hidden>当前对话模型无法自动同步，可单独选择执行模型。</p>
      <p class="muted catalog-state" id="catalog-state">尚未读取模型目录，读取后才能保存设置。</p>
      <p class="muted model-note" id="saved-settings" hidden></p>
      <p class="muted model-note">设置只对后续授权任务生效，已有任务保持其实际模型。</p>
      <div id="model-settings" hidden>
        <div class="field-group">
          <label for="execution-mode">执行方式</label>
          <select id="execution-mode" disabled>
            <option value="default">Codex 默认执行模型</option>
            <option value="custom">单独选择执行模型</option>
          </select>
        </div>
        <div class="settings-grid" id="custom-model-settings" hidden>
          <div class="field-group">
            <label for="execution-model">模型</label>
            <select id="execution-model" disabled><option value="">选择模型</option></select>
          </div>
          <div class="field-group">
            <label for="reasoning-effort">推理强度</label>
            <select id="reasoning-effort" disabled><option value="">选择推理强度</option></select>
          </div>
        </div>
        <div class="settings-actions">
          <p class="muted" id="settings-state" role="status" aria-live="polite">尚未保存执行设置。</p>
          <button id="save-execution" type="button" disabled>保存设置</button>
        </div>
      </div>
    </section>
    <section aria-labelledby="jobs-heading">
      <div class="section-heading"><h2 id="jobs-heading">任务</h2><div class="form-row"><button id="stop" type="button" class="danger" disabled>立即停止</button><button id="refresh" type="button" disabled>刷新</button></div></div>
      <p class="muted" id="faculty">尚未初始化学院</p>
      <ul id="jobs" aria-label="工程执行任务"></ul>
      <p class="muted" id="empty">选择工程后显示任务状态。</p>
    </section>
  </main>
